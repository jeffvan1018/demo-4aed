name: Antigravity PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keyless authentication via Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Assistant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'gemini-flash-3.8' }}
        run: uv run .github/scripts/pr_assistant.py